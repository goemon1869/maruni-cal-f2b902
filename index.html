<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マルニ休日">
<meta name="theme-color" content="#ffffff">
<script>if(innerWidth>=900&&!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)&&location.hash!=="#sp")location.replace("pc.html")</script>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>マルニ カレンダー</title>
<style>

:root{--ink:#171717;--red:#d71021;--gray:#6e6e6e;--teal:#008080;--line:#404040}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);max-width:560px;margin:0 auto}
header{padding:10px 12px 4px;text-align:center}
.title{display:inline-block;color:var(--teal);font:italic bold 17px Helvetica,Arial,sans-serif;border-bottom:1.5px solid var(--teal);padding:0 2px 1px}
.bar{display:flex;align-items:center;gap:8px;padding:6px 10px}
.bar .sp{flex:1}
button,select{font:inherit;font-size:15px;border:1px solid #bbb;background:#fff;border-radius:10px;padding:7px 12px;color:var(--ink)}
button:active{background:#eee}
button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.mhead{display:flex;align-items:center;justify-content:center;gap:14px;padding:2px 0 6px}
.mhead .m{color:var(--gray);font-family:MNum,"Arial Narrow",sans-serif;font-size:34px;line-height:1}
.mhead .m i{font:normal 22px MMon,"MS Gothic","Hiragino Sans",sans-serif;margin-left:2px}
.nav{width:46px;font-size:20px;padding:6px 0}
table{border-collapse:collapse;width:calc(100% - 16px);margin:0 8px;table-layout:fixed}
th{font:normal 13px MWk,"Hiragino Sans",sans-serif;color:var(--gray);border:1px solid var(--line);padding:4px 0;background:#fff}
td{border:1px solid var(--line);height:calc((100vw - 16px) / 7 * 1.08);max-height:76px;text-align:center;vertical-align:middle;
   font-family:MNum,"Arial Narrow","Helvetica Neue",sans-serif;font-size:30px;color:var(--ink);padding:0}
td.h{color:var(--red)}
td.t span{display:inline-block;min-width:1.5em;border:2px solid var(--teal);border-radius:50%;line-height:1.35}
.sum{margin:10px 12px;padding:10px 12px;border-radius:12px;background:#f3f6f6;font-size:15px;line-height:1.6}
.sum b{font-size:19px}
.legend{margin:2px 14px 0;font-size:13px;color:var(--gray)}
.legend .r{color:var(--red);font-weight:bold}
.year{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;padding:4px 8px}
.mini{cursor:pointer;align-self:start}
.mini .n{color:var(--gray);font:20px MNum,"Arial Narrow",sans-serif}
.mini .n i{font:normal 13px MMon,"MS Gothic",sans-serif}
.mini table{width:100%;margin:0}
.mini th{font-size:8px;padding:1px 0}
.mini td{height:auto;max-height:none;font-size:14px;line-height:1.5}
.mini td.t span{border-width:1.5px;min-width:1.3em;line-height:1.2}
.foot{display:flex;align-items:center;gap:6px;justify-content:center;color:#777;font-size:12px;padding:8px 0 20px}
.rfw{text-align:center;padding:0 0 26px}
.rfw button{font-size:14px;padding:8px 18px}
.dot{width:9px;height:9px;border-radius:50%;background:#3bb54a}
.dot.off{background:#d33}
body.cloud td,body.cloud .mhead .m,body.cloud .mini .n{font-family:"Avenir Next Condensed","Arial Narrow","Helvetica Neue",sans-serif;font-weight:700}
body.cloud .mhead .m i,body.cloud .mini .n i{font-family:-apple-system,"Hiragino Sans",sans-serif}
</style></head><body class="cloud">
<header><span class="title" id="title">&nbsp;</span></header>
<div class="bar">
  <select id="ysel"></select>
  <span class="sp"></span>
  <button id="bm" class="on">月</button><button id="by">年間</button>
</div>
<div id="main"></div>
<div class="legend"><span class="r">赤い日</span> = 休日 / 黒い日 = 稼働日 / 青緑の丸 = 今日</div>
<div class="foot"><span class="dot" id="dot"></span><span id="stat">読み込み中…</span></div>
<div class="rfw"><button id="rf">更新</button></div>
<script>
var WK='日月火水木金土', S=null, Y=null, M=1, view='month', userY=false;
function $(i){return document.getElementById(i)}
function pad(n){return (n<10?'0':'')+n}
function key(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function dim(y,m){return new Date(y,m,0).getDate()}
function wk1(y,m){return new Date(y,m-1,1).getDay()}
function hset(y){return new Set((S.years[y]||{holidays:[]}).holidays)}
var T=new Date(), TK=key(T.getFullYear(),T.getMonth()+1,T.getDate());
function monthTable(y,m,hs,mini){
  var h='<table><tr>'+WK.split('').map(function(w){return '<th>'+w+'</th>'}).join('')+'</tr>';
  var col=wk1(y,m), n=dim(y,m), d=1;
  for(var r=0;r<6;r++){
    h+='<tr>';
    for(var c=0;c<7;c++){
      if((r===0&&c<col)||d>n){h+='<td></td>';continue}
      var k=key(y,m,d), cl=(hs.has(k)?'h ':'')+(k===TK?'t':'');
      h+='<td class="'+cl+'"><span>'+d+'</span></td>'; d++;
    }
    h+='</tr>'; if(d>n)break;
  }
  return h+'</table>';
}
function counts(y,m,hs){var n=dim(y,m),h=0;for(var d=1;d<=n;d++)if(hs.has(key(y,m,d)))h++;return [n-h,h]}
function render(){
  if(!S||!S.years[Y])return;
  var ys=Object.keys(S.years), sel=$('ysel');
  sel.innerHTML=ys.map(function(y){return '<option value="'+y+'"'+(String(y)===String(Y)?' selected':'')+'>'+y+'年</option>'}).join('');
  sel.style.visibility=ys.length>1?'visible':'hidden';
  $('title').textContent=S.years[Y].title||'';
  $('bm').className=view==='month'?'on':''; $('by').className=view==='year'?'on':'';
  var hs=hset(Y), h='';
  if(view==='month'){
    var c=counts(Y,M,hs), tw=0,th=0;
    for(var m=1;m<=12;m++){var cc=counts(Y,m,hs);tw+=cc[0];th+=cc[1]}
    h+='<div class="mhead"><button class="nav" id="pv">◀</button><div class="m">'+M+'<i>月</i></div><button class="nav" id="nx">▶</button></div>';
    h+=monthTable(Y,M,hs);
    h+='<div class="sum">'+M+'月:稼働日 <b>'+c[0]+'</b>日 / 休日 <b style="color:var(--red)">'+c[1]+'</b>日<br>'+Y+'年 年間:稼働日 <b>'+tw+'</b>日 / 休日 <b style="color:var(--red)">'+th+'</b>日</div>';
  } else {
    h+='<div class="year">';
    for(var m=1;m<=12;m++){h+='<div class="mini" data-m="'+m+'"><div class="n">'+m+'<i>月</i></div>'+monthTable(Y,m,hs,true)+'</div>'}
    h+='</div>';
  }
  $('main').innerHTML=h;
  if(view==='month'){$('pv').onclick=function(){go(-1)};$('nx').onclick=function(){go(1)}}
  else{Array.prototype.forEach.call(document.querySelectorAll('.mini'),function(b){b.onclick=function(){M=+b.getAttribute('data-m');view='month';render()}})}
}
function go(d){
  M+=d;
  var py=String(+Y-1), ny=String(+Y+1);
  if(M<1){ if(S.years[py]){Y=py;userY=true;M=12}else M=1 }
  else if(M>12){ if(S.years[ny]){Y=ny;userY=true;M=1}else M=12 }
  render();
}
function startMonth(y){return (T.getFullYear()===+y)?T.getMonth()+1:1}
function poll(){
  fetch('state.json?'+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    var first=!S, changed=!S||j.rev!==S.rev, prevCur=S?String(S.current):null; S=j;
    if(first){
      var ty=String(T.getFullYear());
      Y=S.years[ty]?ty:String(j.current||Object.keys(S.years)[0]); M=startMonth(Y);
    } else if(!userY&&prevCur!==String(j.current)&&String(j.current)!==String(Y)&&S.years[j.current]){Y=String(j.current);M=startMonth(Y)}
    if(!S.years[Y]) Y=String(j.current);
    if(changed) render();
    $('dot').className='dot';
    $('stat').textContent='最新の状態です('+pad(new Date().getHours())+':'+pad(new Date().getMinutes())+' 確認)';
  }).catch(function(){
    $('dot').className='dot off';
    $('stat').textContent='つながりません(電波・ネットの状態を確認してください)';
  });
}
$('ysel').onchange=function(){Y=this.value;userY=true;M=startMonth(Y);render()};
$('bm').onclick=function(){view='month';render()};
$('by').onclick=function(){view='year';render()};
var sx=null;
document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){
  if(sx===null||view!=='month')return;
  var dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)>70)go(dx<0?1:-1);
},{passive:true});
document.addEventListener('visibilitychange',function(){if(!document.hidden)poll()});
window.addEventListener('pageshow',function(e){if(e.persisted)poll()});
$('rf').onclick=function(){$('stat').textContent='確認しています…';poll()};
poll();
</script></body></html>
